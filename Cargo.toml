[package]
name = "gpu-survivor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "gpu-survivor"
path = "src/game/main.rs"

[dependencies]
macroquad = { version = "=0.4.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.'*']
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
